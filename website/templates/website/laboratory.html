<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Химическая лаборатория</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
            min-height: calc(100vh - 103px);
            user-select: none;
        }

        /* Навигационная панель */
nav {
    background-color: #2c3e50;
    color: white;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 20px;
  }
  
  nav .logo {
    font-size: 24px;
    font-weight: bold;
  }
  
  nav ul {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
  }
  
  nav ul li {
    margin: 0 15px;
  }
  
  nav ul li a {
    color: white;
    text-decoration: none;
    font-size: 18px;
    transition: 0.3s;
  }
  
  nav ul li a:hover {
    text-decoration: underline;
  }
  

        #lab-desk {
            width: 90%;
            height: 65vh;
            margin: 20px auto;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        #tools-panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #444;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            padding: 15px;
            border-top: 3px solid #333;
        }

        .tool-item {
            width: 70px;
            height: 70px;
            background: #fff;
            border-radius: 10px;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 12px;
            text-align: center;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
        }

        .tool-item:active {
            cursor: grabbing;
        }

        .draggable {
            position: absolute;
            cursor: move;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .draggable:hover {
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
        }

        .flask {
            width: 50px;
            height: 100px;
            background: #e0e0e0;
            border-radius: 10px 10px 30px 30px;
            position: relative;
            border: 2px solid #ccc;
        }

        .test-tube {
            width: 30px;
            height: 80px;
            background: #e8e8e8;
            border-radius: 5px 5px 15px 15px;
            position: relative;
            border: 2px solid #ccc;
        }

        .liquid {
            position: absolute;
            bottom: 0;
            width: 100%;
            border-radius: 0 0 15px 15px;
            transition: height 0.5s, background-color 0.5s;
        }

        .burner {
            width: 60px;
            height: 30px;
            background: #666;
            border-radius: 5px 5px 20px 20px;
            position: absolute;
            bottom: 0;
        }

        .burner.active {
            animation: burner-flame 0.5s infinite alternate;
        }

        @keyframes burner-flame {
            0% {
                background: #ff5500;
                box-shadow: 0 0 20px #ff5500;
            }

            100% {
                background: #ff9933;
                box-shadow: 0 0 30px #ff9933;
            }
        }

        .bubbles {
            position: absolute;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            width: 8px;
            height: 8px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            animation: bubble-rise 2s infinite;
        }

        @keyframes bubble-rise {
            0% {
                transform: translateY(0);
                opacity: 0;
            }

            50% {
                opacity: 1;
            }

            100% {
                transform: translateY(-100px);
                opacity: 0;
            }
        }

        .control-panel {
            padding-block-start: 24px;
            width: 100%;
            justify-content: center;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }

        button {
            padding: 12px 20px;
            cursor: pointer;
            background: #4CAF50;
            border: none;
            color: white;
            border-radius: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        .reagent {
            width: 40px;
            height: 60px;
            border-radius: 5px;
            position: relative;
            overflow: hidden;
        }

        .reagent-bottle {
            width: 35px;
            height: 50px;
            background: #fff;
            border-radius: 5px;
            position: relative;
            transition: transform 0.3s;
        }

        .pour-target {
            transform: rotate(-25deg);
            transition: transform 0.3s;
        }

        .active-pouring {
            transform: rotate(-90deg) scale(0.9);
            transition: all 0.3s;
        }

        .heating-overlay {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 30px;
            background: rgba(255, 0, 0, 0.3);
            border-radius: 50%;
            animation: heat-pulse 1s infinite;
        }

        @keyframes heat-pulse {
            0% {
                transform: translateX(-50%) scale(0.8);
            }

            50% {
                transform: translateX(-50%) scale(1.2);
            }

            100% {
                transform: translateX(-50%) scale(0.8);
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            z-index: 1001;
            max-width: 400px;
            text-align: center;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .fixed-position {
            cursor: default !important;
            pointer-events: none;
        }

        .temperature-indicator {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            padding: 2px 5px;
            border-radius: 3px;
        }

        .burner-temperature {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 12px;
            text-shadow: 0 0 3px black;
        }
    </style>
</head>

<body>
    {% include 'partials/navbar.html' %}
    <div class="control-panel">
        <button onclick="toggleBurner()" id="burnerBtn">Включить горелку</button>
        <button onclick="runReaction()">Проверить реакцию</button>
        <button onclick="undo()">Отменить действие</button>
    </div>

    <div id="lab-desk">
        <div class="burner" id="main-burner" style="left: calc(50% - 30px);"></div>
    </div>

    <div id="tools-panel">
        <div class="tool-item" data-type="flask">
            <div class="flask"></div>
            Колба
        </div>
        <div class="tool-item" data-type="test-tube">
            <div class="test-tube"></div>
            Пробирка
        </div>
        <div class="tool-item" data-type="h2o">
            <div class="reagent" style="background: #00b0ff;">
                <div class="reagent-bottle"></div>
            </div>
            Вода
        </div>
        <div class="tool-item" data-type="hcl">
            <div class="reagent" style="background: #ffeb3b;">
                <div class="reagent-bottle"></div>
            </div>
            HCl
        </div>
        <div class="tool-item" data-type="naoh">
            <div class="reagent" style="background: #8bc34a;">
                <div class="reagent-bottle"></div>
            </div>
            NaOH
        </div>
        <div class="tool-item" data-type="cu">
            <div class="reagent" style="background: #ff5722;">
                <div class="reagent-bottle"></div>
            </div>
            Медь
        </div>
        <div class="tool-item" data-type="ag">
            <div class="reagent" style="background: #9e9e9e;">
                <div class="reagent-bottle"></div>
            </div>
            Серебро
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay"></div>
    <div class="modal" id="resultModal">
        <h2 id="modalTitle">Результат реакции</h2>
        <div id="modalContent"></div>
        <button onclick="closeModal()">Закрыть</button>
    </div>

    <script>
        let currentDragged = null;
        let offset = { x: 0, y: 0 };
        let actionsHistory = [];
        let activePouring = null;
        let isBurnerOn = false;
        let burnerInterval = null;

        document.querySelectorAll('.tool-item').forEach(item => {
            item.addEventListener('mousedown', startDragging);
        });

        function startDragging(e) {
            const toolItem = e.target.closest('.tool-item');
            if (!toolItem) return;

            const type = toolItem.dataset.type;
            const rect = toolItem.getBoundingClientRect();
            offset = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };

            currentDragged = createElement(type, e.clientX - offset.x, e.clientY - offset.y);
            document.addEventListener('mousemove', drag);
            document.addEventListener('mouseup', stopDragging);
        }

        function drag(e) {
            if (!currentDragged) return;
            currentDragged.style.left = e.clientX - offset.x + 'px';
            currentDragged.style.top = e.clientY - offset.y + 'px';
            checkPouring(currentDragged);
        }

        function stopDragging(e) {
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('mouseup', stopDragging);

            if (isWithinDesk(currentDragged)) {
                finalizeElement(currentDragged);
                saveAction('add', currentDragged);
                enableDragging(currentDragged);
            } else {
                currentDragged.remove();
            }
            currentDragged = null;
            resetPouring();
        }

        function createElement(type, x, y) {
            const element = document.createElement('div');
            element.className = 'draggable';
            element.style.position = 'absolute';
            element.style.left = x + 'px';
            element.style.top = y + 'px';

            switch (type) {
                case 'flask':
                    element.classList.add('flask');
                    element.innerHTML = `<div class="liquid"></div>`;
                    element.dataset.content = '';
                    element.dataset.volume = 0;
                    element.dataset.temperature = 25;
                    break;

                case 'test-tube':
                    element.classList.add('test-tube');
                    element.innerHTML = `<div class="liquid"></div>`;
                    element.dataset.content = '';
                    element.dataset.volume = 0;
                    element.dataset.temperature = 25;
                    break;

                default:
                    element.classList.add('reagent');
                    element.style.background = getReagentColor(type);
                    element.innerHTML = `
                        <div class="reagent-bottle"></div>
                        <div class="bubbles"></div>
                    `;
                    element.dataset.type = type;
            }

            return document.body.appendChild(element);
        }

        function enableDragging(element) {
            element.addEventListener('mousedown', startElementDrag);
        }

        function startElementDrag(e) {
            const element = e.target.closest('.draggable');
            if (!element || element.classList.contains('fixed-position')) return;

            const rect = element.getBoundingClientRect();
            offset = {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };

            element.style.zIndex = 9999;
            document.addEventListener('mousemove', moveElement);
            document.addEventListener('mouseup', stopElementDrag);
        }

        function moveElement(e) {
            const element = document.elementFromPoint(e.clientX, e.clientY).closest('.draggable');
            if (!element || element.classList.contains('fixed-position')) return;

            const deskRect = document.getElementById('lab-desk').getBoundingClientRect();
            let newX = e.clientX - offset.x;
            let newY = e.clientY - offset.y;

            newX = Math.max(deskRect.left, Math.min(newX, deskRect.right - element.offsetWidth));
            newY = Math.max(deskRect.top, Math.min(newY, deskRect.bottom - element.offsetHeight));

            element.style.left = newX + 'px';
            element.style.top = newY + 'px';

            checkPouring(element);
            checkHeating(element);
        }

        function stopElementDrag(e) {
            document.removeEventListener('mousemove', moveElement);
            document.removeEventListener('mouseup', stopElementDrag);
            const element = e.target.closest('.draggable');
            if (element) {
                element.style.zIndex = '';
                saveAction('move', element);
            }
        }

        function checkPouring(element) {
            if (!element.classList.contains('reagent')) return;

            const containers = document.querySelectorAll('.flask, .test-tube');
            let foundTarget = false;

            containers.forEach(container => {
                if (isOverlapping(element, container)) {
                    foundTarget = true;
                    if (activePouring !== container) {
                        startPouring(element, container);
                    }
                }
            });

            if (!foundTarget) resetPouring();
        }

        function startPouring(reagent, container) {
            activePouring = container;
            container.classList.add('pour-target');
            reagent.querySelector('.reagent-bottle').classList.add('active-pouring');

            const prevState = {
                volume: container.dataset.volume,
                content: container.dataset.content,
                color: container.querySelector('.liquid').style.backgroundColor
            };

            const pourInterval = setInterval(() => {
                if (activePouring === container) {
                    addLiquid(container, reagent.dataset.type, 2);
                } else {
                    clearInterval(pourInterval);
                    saveAction('pour', container, prevState);
                }
            }, 100);
        }

        function resetPouring() {
            if (activePouring) {
                activePouring.classList.remove('pour-target');
                activePouring = null;
            }
            document.querySelectorAll('.reagent-bottle').forEach(b =>
                b.classList.remove('active-pouring'));
        }

        function addLiquid(container, type, amount) {
            const liquid = container.querySelector('.liquid');
            const currentVolume = parseInt(container.dataset.volume) || 0;
            const maxVolume = container.classList.contains('flask') ? 150 : 80;
            const newVolume = Math.min(currentVolume + amount, maxVolume);

            container.dataset.volume = newVolume;
            liquid.style.height = newVolume + '%';

            const contents = (container.dataset.content || '').split(',').filter(Boolean);
            if (!contents.includes(type)) {
                contents.push(type);
                container.dataset.content = contents.join(',');
                liquid.style.backgroundColor = mixColors(
                    liquid.style.backgroundColor,
                    getReagentColor(type),
                    contents.length
                );
            }

            if (newVolume > 0) {
                container.classList.add('fixed-position');
            }
        }

        function checkHeating(element) {
            const burner = document.getElementById('main-burner');
            if ((element.classList.contains('flask') || element.classList.contains('test-tube')) &&
                isOverlapping(element, burner)) {

                if (!element.querySelector('.heating-overlay')) {
                    const overlay = document.createElement('div');
                    overlay.className = 'heating-overlay';
                    element.appendChild(overlay);
                }
            } else {
                const overlay = element.querySelector('.heating-overlay');
                if (overlay) overlay.remove();
            }
        }

        function toggleBurner() {
            isBurnerOn = !isBurnerOn;
            const burner = document.getElementById('main-burner');
            burner.innerHTML = isBurnerOn ?
                '<div class="burner-temperature">500°C</div>' :
                '';
            document.getElementById('burnerBtn').textContent = isBurnerOn ? 'Выключить горелку' : 'Включить горелку';
            burner.classList.toggle('active', isBurnerOn);

            if (isBurnerOn) {
                burnerInterval = setInterval(() => {
                    document.querySelectorAll('.flask, .test-tube').forEach(container => {
                        if (isOverlapping(container, burner)) {
                            const temp = parseInt(container.dataset.temperature) || 25;
                            container.dataset.temperature = temp + 1;
                            updateTemperatureDisplay(container);
                        }
                    });
                }, 1000);
            } else {
                clearInterval(burnerInterval);
            }
        }

        function updateTemperatureDisplay(container) {
            let tempDisplay = container.querySelector('.temperature-indicator');
            if (!tempDisplay) {
                tempDisplay = document.createElement('div');
                tempDisplay.className = 'temperature-indicator';
                container.appendChild(tempDisplay);
            }
            tempDisplay.textContent = `${container.dataset.temperature}°C`;
        }

        function mixColors(color1, color2, count) {
            const hexToRgb = hex => {
                const bigint = parseInt(hex.replace('#', ''), 16);
                return [(bigint >> 16) & 255, (bigint >> 8) & 255, bigint & 255];
            };

            const rgb1 = hexToRgb(color1 || '#ffffff');
            const rgb2 = hexToRgb(color2);
            const ratio = 1 / count;

            const r = Math.round(rgb1[0] + (rgb2[0] - rgb1[0]) * ratio);
            const g = Math.round(rgb1[1] + (rgb2[1] - rgb1[1]) * ratio);
            const b = Math.round(rgb1[2] + (rgb2[2] - rgb1[2]) * ratio);

            return `rgb(${r},${g},${b})`;
        }

        function getReagentColor(type) {
            const colors = {
                h2o: '#00b0ff',
                hcl: '#ffeb3b',
                naoh: '#8bc34a',
                cu: '#ff5722',
                ag: '#9e9e9e'
            };
            return colors[type] || '#fff';
        }

        function isWithinDesk(element) {
            const deskRect = document.getElementById('lab-desk').getBoundingClientRect();
            const elementRect = element.getBoundingClientRect();
            return (
                elementRect.top >= deskRect.top &&
                elementRect.bottom <= deskRect.bottom &&
                elementRect.left >= deskRect.left &&
                elementRect.right <= deskRect.right
            );
        }

        function isOverlapping(a, b) {
            const aRect = a.getBoundingClientRect();
            const bRect = b.getBoundingClientRect();
            return !(
                aRect.bottom < bRect.top ||
                aRect.top > bRect.bottom ||
                aRect.right < bRect.left ||
                aRect.left > bRect.right
            );
        }

        function saveAction(type, element, extraData = {}) {
            const state = {
                x: element.style.left,
                y: element.style.top,
                data: JSON.parse(JSON.stringify(element.dataset)),
                ...extraData
            };
            actionsHistory.push({ type, element, state });
        }

        function undo() {
            if (actionsHistory.length === 0) return;
            const lastAction = actionsHistory.pop();

            switch (lastAction.type) {
                case 'add':
                    lastAction.element.remove();
                    break;

                case 'move':
                    lastAction.element.style.left = lastAction.state.x;
                    lastAction.element.style.top = lastAction.state.y;
                    Object.assign(lastAction.element.dataset, lastAction.state.data);
                    updateLiquid(lastAction.element);
                    break;

                case 'pour':
                    lastAction.element.dataset.volume = lastAction.state.volume;
                    lastAction.element.dataset.content = lastAction.state.content;
                    lastAction.element.querySelector('.liquid').style.backgroundColor = lastAction.state.color;
                    break;

                case 'heat':
                    lastAction.element.dataset.temperature = lastAction.state.temperature;
                    break;
            }
        }

        function updateLiquid(element) {
            const liquid = element.querySelector('.liquid');
            if (liquid) {
                liquid.style.height = element.dataset.volume + '%';
                if (element.dataset.color) {
                    liquid.style.backgroundColor = element.dataset.color;
                }
            }
        }

        function runReaction() {
            let reactionResults = [];

            document.querySelectorAll('.flask, .test-tube').forEach(container => {
                const contents = (container.dataset.content || '').split(',').filter(Boolean);
                const temp = parseInt(container.dataset.temperature) || 25;

                let result = `<strong>${container.classList.contains('flask') ? 'Колба' : 'Пробирка'}:</strong><br>`;
                result += `Состав: ${contents.join(', ') || 'пусто'}<br>`;
                result += `Температура: ${temp}°C<br>`;

                if (contents.includes('hcl') && contents.includes('cu')) {
                    if (temp > 100) {
                        result += "Реакция: 2HCl + Cu (нагревание) → CuCl₂ + H₂↑";
                    } else {
                        result += "Реакция: 2HCl + Cu → медленное растворение (требуется нагрев)";
                    }
                }
                else if (contents.includes('naoh') && contents.includes('hcl')) {
                    if (temp > 50) {
                        result += "Реакция: NaOH + HCl → NaCl + H₂O (ускоренная)";
                    } else {
                        result += "Реакция: NaOH + HCl → NaCl + H₂O";
                    }
                }
                else if (contents.includes('h2o') && contents.includes('naoh')) {
                    result += "Растворение NaOH в воде";
                }
                else {
                    result += "Активных реакций не обнаружено";
                }

                reactionResults.push(result);
            });

            showModal('Результаты эксперимента', reactionResults.join('<hr>'));
        }

        function showModal(title, content) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').innerHTML = content;
            document.getElementById('modalOverlay').style.display = 'block';
            document.getElementById('resultModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
            document.getElementById('resultModal').style.display = 'none';
        }

        function createBubbles(container) {
            const bubbles = container.querySelector('.bubbles');
            if (!bubbles) return;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.style.left = Math.random() * 80 + 10 + '%';
            bubbles.appendChild(bubble);

            setTimeout(() => bubble.remove(), 2000);
        }
        function runReaction() {
            let reactionResults = [];

            document.querySelectorAll('.flask, .test-tube').forEach(container => {
                const contents = (container.dataset.content || '').split(',').filter(Boolean);
                const temp = parseInt(container.dataset.temperature) || 25;
                const volume = parseInt(container.dataset.volume) || 0;

                // Пропускаем пустые сосуды
                if (contents.length === 0 || volume === 0) return;

                let result = `<strong>${container.classList.contains('flask') ? 'Колба' : 'Пробирка'}:</strong><br>`;
                result += `Состав: ${contents.join(', ')}<br>`;
                result += `Температура: ${temp}°C<br>`;

                if (contents.includes('hcl') && contents.includes('cu')) {
                    if (temp > 100) {
                        result += "Реакция: 2HCl + Cu (нагревание) → CuCl₂ + H₂↑";
                    } else {
                        result += "Реакция: 2HCl + Cu → медленное растворение (требуется нагрев)";
                    }
                }
                else if (contents.includes('naoh') && contents.includes('hcl')) {
                    if (temp > 50) {
                        result += "Реакция: NaOH + HCl → NaCl + H₂O (ускоренная)";
                    } else {
                        result += "Реакция: NaOH + HCl → NaCl + H₂O";
                    }
                }
                else if (contents.includes('h2o') && contents.includes('naoh')) {
                    result += "Растворение NaOH в воде";
                }
                else {
                    result += "Активных реакций не обнаружено";
                }

                reactionResults.push(result);
            });

            if (reactionResults.length === 0) {
                showModal('Результаты эксперимента', 'Нет активных сосудов с реагентами');
            } else {
                showModal('Результаты эксперимента', reactionResults.join('<hr>'));
            }
        }
    </script>
</body>

</html>
